query NODE_LIST_QUERY($first: Int!, $after: String) {
  mediaItems(first: $first, after: $after) {
    nodes {
      altText

      ancestors(first: 100) {
        nodes {
          contentType {
            node {
              __typename
              id
            }
          }

          contentTypeName
          databaseId
          date
          dateGmt
          desiredSlug
          enclosure
          guid
          id
          isComment
          isContentNode
          isFrontPage
          isPostsPage
          isTermNode

          lastEditedBy {
            node {
              __typename
              id
            }
          }

          link
          modified
          modifiedGmt
          slug
          status

          template {
            templateName

            __typename
          }

          uri

          __typename

          ... on MediaItem {
            id
          }

          ... on Page {
            id
          }

          ... on Post {
            id
          }

          ... on GraphqlDocument {
            id
          }
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      author {
        node {
          __typename
          id
        }
      }

      authorDatabaseId
      authorId
      caption

      wpChildren: children(first: 100) {
        nodes {
          contentType {
            node {
              __typename
              id
            }
          }

          contentTypeName
          databaseId
          date
          dateGmt
          desiredSlug
          enclosure
          guid
          id
          isComment
          isContentNode
          isFrontPage
          isPostsPage
          isTermNode

          lastEditedBy {
            node {
              __typename
              id
            }
          }

          link
          modified
          modifiedGmt
          slug
          status

          template {
            templateName

            __typename
          }

          uri

          __typename

          ... on MediaItem {
            id
          }

          ... on Page {
            id
          }

          ... on Post {
            id
          }

          ... on GraphqlDocument {
            id
          }
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      commentCount
      commentStatus

      comments(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      contentType {
        node {
          __typename
          id
        }
      }

      contentTypeName
      databaseId
      date
      dateGmt
      description
      desiredSlug
      enclosure
      file
      filePath
      fileSize
      guid
      hasPassword
      id
      isComment
      isContentNode
      isFrontPage
      isPostsPage
      isTermNode

      lastEditedBy {
        node {
          __typename
          id
        }
      }

      link

      mediaDetails {
        file
        filePath
        height

        meta {
          aperture
          camera
          caption
          copyright
          createdTimestamp
          credit
          focalLength
          iso
          keywords
          orientation
          shutterSpeed
          title
        }

        sizes {
          file
          filePath
          fileSize
          height
          mimeType
          name
          sourceUrl
          width
        }

        width
      }

      mediaItemId
      mediaItemUrl
      mediaType
      mimeType
      modified
      modifiedGmt

      wpParent: parent {
        node {
          contentType {
            node {
              __typename
              id
            }
          }

          contentTypeName
          databaseId
          date
          dateGmt
          desiredSlug
          enclosure
          guid
          id
          isComment
          isContentNode
          isFrontPage
          isPostsPage
          isTermNode

          lastEditedBy {
            node {
              __typename
              id
            }
          }

          link
          modified
          modifiedGmt
          slug
          status

          template {
            templateName

            __typename
          }

          uri

          __typename

          ... on MediaItem {
            id
          }

          ... on Page {
            id
          }

          ... on Post {
            id
          }

          ... on GraphqlDocument {
            id
          }
        }
      }

      parentDatabaseId
      parentId
      password
      sizes
      slug
      sourceUrl
      srcSet
      status

      template {
        templateName

        __typename
      }

      title
      uri
      __typename
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
