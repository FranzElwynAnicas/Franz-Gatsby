query PREVIEW_QUERY($id: ID!) {
  menu(id: $id, idType: ID, asPreview: true) {
    aboutPageContent {
      fieldGroupName
      heroBodyCopy
      heroCtaLabel
      heroHeading

      heroVideo {
        node {
          __typename
          id
        }
      }

      heroWord1
      heroWord2
      introBadgeText
      introHeading

      introImage {
        node {
          __typename
          id
        }
      }

      introParagraph

      photoService {
        fieldGroupName
        servicesPhotoBody
        servicesPhotoHeading

        servicesPhotoImage {
          node {
            __typename
            id
          }
        }
      }

      storyHeading
      storyIntro
      videoSectionHeading

      videoSectionVideo {
        node {
          __typename
          id
        }
      }

      videoservice {
        fieldGroupName
        servicesVideoBody
        servicesVideoHeading

        servicesVideoImage {
          node {
            __typename
            id
          }
        }
      }

      whoHeading
      whoRotatingNames
      whoTestimonialsCta
      whoTestimonialsUrl

      whoparagraphs {
        fieldGroupName
        whoParagraph1
        whoParagraph2
        whoParagraph3Prefix
        whoParagraph3Suffix
      }

      whyHeading
      whyIntroParagraph

      whyItems {
        fieldGroupName
        item1Desc
        item1Title
        item2Desc
        item2Title
        item3Desc
        item3Title
        item4Desc
        item4Title
        item5Desc
        item5Title
      }

      worksHeading

      worksSlides {
        fieldGroupName
        slide1Description

        slide1Media {
          node {
            __typename
            id
          }
        }

        slide1Subtitle
        slide1Tag
        slide2Description

        slide2Media {
          node {
            __typename
            id
          }
        }

        slide2Subtitle
        slide2Tag
        slide3Description

        slide3Media {
          node {
            __typename
            id
          }
        }

        slide3Subtitle
        slide3Tag
        slide4Description

        slide4Media {
          node {
            __typename
            id
          }
        }

        slide4Subtitle
        slide4Tag
      }
    }

    count
    databaseId
    id
    locations
    menuId

    menuItems(first: 100) {
      nodes {
        __typename
        id
      }

      pageInfo {
        endCursor
        hasNextPage
        hasPreviousPage
        startCursor
      }
    }

    name
    slug
    __typename
  }
}
