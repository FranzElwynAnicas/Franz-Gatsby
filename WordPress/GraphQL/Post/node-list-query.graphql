query NODE_LIST_QUERY($first: Int!, $after: String) {
  posts(first: $first, after: $after) {
    nodes {
      ancestors(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      author {
        node {
          __typename
          id
        }
      }

      authorDatabaseId
      authorId

      categories(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      commentCount
      commentStatus

      comments(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      content

      contentType {
        node {
          __typename
          id
        }
      }

      contentTypeName
      databaseId
      date
      dateGmt
      desiredSlug
      enclosure
      excerpt

      featuredImage {
        node {
          __typename
          id
        }
      }

      featuredImageDatabaseId
      featuredImageId
      guid
      hasPassword
      id
      isComment
      isContentNode
      isFrontPage
      isPostsPage
      isRevision
      isSticky
      isTermNode

      lastEditedBy {
        node {
          __typename
          id
        }
      }

      link
      modified
      modifiedGmt

      wpParent: parent {
        node {
          __typename
          id
        }
      }

      password
      pingStatus
      pinged

      postFormats(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      postId
      slug
      status

      tags(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      template {
        templateName

        __typename
      }

      terms(first: 100) {
        nodes {
          __typename
          id
        }

        pageInfo {
          endCursor
          hasNextPage
          hasPreviousPage
          startCursor
        }
      }

      title
      toPing
      uri
      __typename
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
